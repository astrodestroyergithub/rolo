[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm run build"

[dev]
  publish = "."
  functions = "netlify/functions"
  port = 8888

[[redirects]]
  from = "/api/properties"
  to = "/.netlify/functions/properties"
  status = 200

[[redirects]]
  from = "/api/bookings"
  to = "/.netlify/functions/bookings"
  status = 200

[[redirects]]
  from = "/api/resident"
  to = "/.netlify/functions/resident"
  status = 200

[[redirects]]
  from = "/api/db-health"
  to = "/.netlify/functions/db-health"
  status = 200

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "image/svg+xml"
